name: unpack-site
on:
  push:
    paths: ['cleburne-wire-site.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site source
        run: |
          unzip -o cleburne-wire-site.zip
          git rm -q --cached cleburne-wire-site.zip
          rm cleburne-wire-site.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack live site source from Netlify deploy"
          git push
