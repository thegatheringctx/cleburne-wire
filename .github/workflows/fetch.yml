name: fetch-site
on:
  push:
    paths: ['.github/workflows/fetch.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and unpack live site source
        env:
          SRC: "https://acmhtvmqekccmlcueweg.supabase.co/storage/v1/object/sign/handoff/site.zip?token=eyJraWQiOiJjY2VhYmY2OC0yNjRmLTQ1YzUtYjk0Yy1lYTcyN2IyMWE1MmIiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJoYW5kb2ZmL3NpdGUuemlwIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc5MDcxNDY4OSwiZXhwIjoxNzkwNzE4Mjg5fQ.5aml1NPFbN_MoII49h82JbjvP6g5igcU3ae_YvlrSJk40KAeJJcLvpCg2-wX2IGcA8WrZWLFcu1Ppqsk8IqOjw"
        run: |
          curl -sfL "$SRC" -o /tmp/site.zip
          unzip -oq /tmp/site.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Live site source from Netlify deploy (Sep 29)"
          git push
